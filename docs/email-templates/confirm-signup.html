<!--
  Supabase → Authentication → Emails → Templates → "Confirm sign up"

  Paste this into the Message body. Supabase only allows editing templates
  once custom SMTP is configured — until then it sends its own English
  default, which is why this lives here rather than in the project settings.

  {{ .ConfirmationURL }} is Supabase's own placeholder; it points at the
  project's verify endpoint, which redirects to /auth/callback in this app.

  Subject: أكّد بريدك في دلال
-->
<div dir="rtl" lang="ar" style="margin:0;padding:32px 16px;background:#07090D;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#E9EDF5">
  <div style="max-width:480px;margin:0 auto;background:#0F1219;border-radius:20px;padding:32px">
    <div style="font-size:22px;font-weight:700;margin-bottom:24px">دلال<span style="color:#F5B942">.</span></div>
    <h1 style="margin:0 0 12px;font-size:24px;font-weight:600;line-height:1.4">أكّد بريدك</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.8;color:#9AA4B8">
      أنشأت حسابًا في دلال. اضغط الزر عشان نتأكد أن هذا بريدك، وبعدها تقدر تزايد وتنشئ مزادات.
    </p>
    <a href="{{ .ConfirmationURL }}"
       style="display:inline-block;background:#F5B942;color:#1A1204;text-decoration:none;font-weight:600;font-size:15px;padding:14px 32px;border-radius:12px">
      أكّد بريدي
    </a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.8;color:#5C6579">
      ما أنشأت حسابًا؟ تجاهل هذي الرسالة ولا يصير شيء.
    </p>
    <p style="margin:20px 0 0;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;line-height:1.8;color:#5C6579">
      ما ضغط الزر؟ انسخ هذا الرابط في المتصفح:<br>
      <span style="color:#9AA4B8;word-break:break-all;direction:ltr;display:inline-block;text-align:left">{{ .ConfirmationURL }}</span>
    </p>
  </div>
  <p style="max-width:480px;margin:16px auto 0;font-size:12px;color:#5C6579;text-align:center">
    دلال — منصة مزادات مباشرة. المبالغ محاكاة وما فيه دفع حقيقي.
  </p>
</div>
