# ============================================================================
# Dalal CI — the thing that runs the suites nobody was running.
#
# Until this file existed, `.github/` held an issue template and a PR template
# and nothing else. Five test suites were written, maintained, argued over in
# review, and executed only when a human remembered to type the command. Any
# one of us could have merged a PR that broke the extension cap, the money
# domain or the whole database, and the only way anyone would have found out is
# by running something later, by hand, for an unrelated reason.
#
# Three developers, three Claude sessions that cannot see each other, one
# protected branch. This file is the part of the review that does not get
# tired, does not forget, and does not take somebody's word for it.
#
# ---------------------------------------------------------------------------
# THE SHAPE — two jobs, split by what they cost, not by what they cover
#
#   static    seconds, no Docker.   Runs on every push of every branch.
#   database  minutes, PostgreSQL 17 in Docker. The three SQL suites.
#
# `static` is deliberately first and deliberately fast: a violation of the
# money rules or the RTL rules should be on screen before the runner has
# finished pulling a database image. The two jobs do NOT depend on each other —
# a broken guard must not hide a broken migration, and vice versa. Both run,
# both report, and the branch is red if either is.
#
# ---------------------------------------------------------------------------
# WHAT THIS CI DOES NOT COVER, SAID PLAINLY
#
# Three suites in tests/ are NOT run here, and this is not an oversight:
#
#   tests/auth/identity-e2e.check.mjs   writes real rows to a real Supabase
#                                       project, and nothing in this product
#                                       can delete an auction (BR-30, BR-31).
#                                       CI would accumulate junk forever.
#   tests/auth/session.check.mjs        needs a running server
#   tests/realtime/reconnect.check.mjs  needs project credentials and 35 s
#                                       against a live realtime socket
#
# All three need credentials, and this repository is PUBLIC (CLAUDE.md §6). A
# workflow secret readable by any fork's pull_request_target is not a place to
# put a key that reaches our database.
#
# That list is not a comment anyone has to trust. `tests/guards/ci-coverage.sh`
# runs in the `static` job below and FAILS if a suite exists in tests/ that is
# neither wired into this file nor written down in its allowlist with a reason.
# Add a test and forget to run it, and CI tells you — which is the failure this
# whole file exists to stop, applied to itself.
# ============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first. The suites are
# deterministic, so a superseded run has nothing to say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # static — no Docker, no credentials, no network beyond npm. Seconds.
  # =========================================================================
  static:
    name: static — guards, lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/guards/run.sh asks git what is TRACKED, and
          # tests/guards/negative.sh restores mutated files with
          # `git checkout --`. Both need real git history, not the
          # detached snapshot a fetch-depth of 1 leaves behind.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # >= 22 is a hard floor: every *.check.mjs imports a .ts module
          # directly and relies on native type-stripping. On an older node the
          # suites announce themselves as NOT RUN and count it as a failure
          # (#121) rather than skipping quietly — so a wrong version here is
          # loud, but there is no reason to make it happen.
          node-version: 22
          cache: npm

      - run: npm ci

      # --- the guards ------------------------------------------------------
      # First, because they are the cheapest and because a money or RTL
      # violation should be on screen in under two seconds.
      - name: guards — the rules with nothing else holding them
        run: ./tests/guards/run.sh

      # A guard that cannot fail is worse than no guard: it reports green for
      # its own reasons while the rule it names rots. This breaks all fifteen
      # rules on purpose and asserts the suite catches every one. It mutates
      # tracked files and restores them, which is why fetch-depth is 0 above.
      - name: guards — prove every check can fail
        run: ./tests/guards/negative.sh

      # And this asserts THIS FILE is complete — that no suite in tests/ is
      # silently unrun. See the header.
      - name: guards — every suite is either in CI or written down as not
        run: ./tests/guards/ci-coverage.sh

      # --- the credential-free suites --------------------------------------
      - name: INT-08 — the excluded-features audit
        run: ./tests/integration/excluded-features.check.sh

      - name: INT-06 — the statically decidable half of 375 px
        run: ./tests/integration/responsive-375.check.sh

      - name: BID-10 — realtime UX rules (RT-X4, RT-X5)
        run: |
          node --no-warnings tests/realtime/convergence.check.mjs
          node --experimental-strip-types --no-warnings tests/realtime/ux-rules.check.mjs

      - name: BID-09 — the auction page mounts the live price region
        run: node --no-warnings tests/realtime/live-price-mount.check.mjs

      # --- the toolchain ---------------------------------------------------
      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # The build runs with NO environment variables at all, and that is the
      # assertion, not a convenience. Every route is server-rendered on demand,
      # so nothing calls publicSupabaseConfig() at build time. The day someone
      # adds a statically prerendered page that reads the database, this step
      # goes red with the exact error that function raises — before the missing
      # value reaches Supabase as the string "undefined" and surfaces days
      # later as an unexplained network error.
      - name: build (deliberately with no credentials)
        run: npm run build

  # =========================================================================
  # database — the three SQL suites against a throwaway PostgreSQL 17.
  # =========================================================================
  #
  # No Supabase account, no shared database, no network. Each run.sh starts its
  # own postgres:17 container, applies the COMMITTED migration files in the
  # order `supabase db push` applies them, and asserts against those — not
  # against a copy. The locking semantics the bidding suite proves are a
  # property of the PostgreSQL engine, so proving them in a container is not a
  # weaker test than proving them in production; it is the same test, cheaper.
  #
  # They run as separate steps rather than one, so a red X names the suite.
  database:
    name: database — auth, auction, bidding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pulled once here so the three suites below do not each pay for it, and
      # so an image-registry failure is reported as an image-registry failure
      # rather than as a suite failure.
      - name: pull postgres:17
        run: docker pull postgres:17

      - name: auth — identity acceptance (AUTH-*)
        run: ./tests/auth/run.sh

      - name: auction — creation, immutability, duplicates (AUC-*)
        run: ./tests/auction/run.sh

      # 8 rounds is run.sh's default and what a normal PR gets. The contract
      # asks for 30 before merging a change to place_bid itself; that is a
      # deliberate human decision at the moment it matters, not a number this
      # file should quietly impose on every push.
      - name: bidding — acceptance, closing, extension, concurrency (BID-*)
        run: ./tests/bidding/run.sh
